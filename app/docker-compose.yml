services:
  web:
    build:
      context: ..
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mohit#2003
      POSTGRES_DB: fastapi_test
    ports:
      - "5432:5432"
